spring:
  application:
    name: policies-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policies}
    username: ${SPRING_DATASOURCE_USERNAME:policies}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:policies}
    password: ${SPRING_RABBITMQ_PASSWORD:local-only-change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

demo:
  controls-enabled: ${DEMO_CONTROLS_ENABLED:true}
  core-outcome: ${DEMO_CORE_OUTCOME:CONFIRM}
  security:
    api-key: ${API_KEY:123456}
    read-token: ${API_READ_TOKEN:demo-read-token}
    operator-token: ${API_OPERATOR_TOKEN:demo-operator-token}
    reviewer-token: ${API_REVIEWER_TOKEN:demo-reviewer-token}

springdoc:
  swagger-ui:
    path: /docs

core:
  base-url: ${CORE_BASE_URL:http://localhost:8081}
  timeout-seconds: ${CORE_TIMEOUT_SECONDS:2}

outbox-relay:
  poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
  batch-size: ${OUTBOX_RELAY_BATCH_SIZE:20}

worker:
  max-core-concurrency: ${MAX_CORE_CONCURRENCY:2}
