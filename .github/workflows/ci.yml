name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify application
        run: ./mvnw -B -ntp verify
      - name: Verify PostgreSQL integration
        run: ./mvnw -B -ntp -Pintegration verify
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build
      - name: Start Compose and wait for health
        run: docker compose up -d --wait --wait-timeout 300 gateway
      - name: Smoke check API
        run: |
          curl --fail http://localhost:8080/health/live
          curl --fail http://localhost:8080/health/ready
          curl --fail -H 'x-api-key: 123456' -H 'Content-Type: application/json' \
            -d '{"party_type":"PERSON","display_name":"CI Demo","document_reference":"SYNTHETIC-CI-001"}' \
            http://localhost:8080/api/v1/parties
          curl --fail -H 'x-api-key: 123456' \
            'http://localhost:8080/api/v1/parties?search=SYNTHETIC-CI-001' | jq -e '.total == 1'
          curl --fail http://localhost:8080/v3/api-docs | jq -e '.info.title == "Rental Policy API"'
      - name: Stop Compose services
        if: always()
        run: docker compose down
