services:
  db:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policies}
      POSTGRES_USER: ${POSTGRES_USER:-policies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-policies} -d ${POSTGRES_DB:-policies}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: flyway/flyway:11.10.0-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      FLYWAY_USER: ${POSTGRES_USER:-policies}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      FLYWAY_CONNECT_RETRIES: 20
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.0.7-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-policies}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-only-change-me}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +SDcpu 1:1 +SDio 1 +A 8"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  api:
    image: policies-service:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      SPRING_FLYWAY_ENABLED: "false"
      API_KEY: ${API_KEY:-123456}
      API_READ_TOKEN: ${API_READ_TOKEN:-demo-read-token}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-demo-operator-token}
      API_REVIEWER_TOKEN: ${API_REVIEWER_TOKEN:-demo-reviewer-token}
      CORE_BASE_URL: http://core-mock:8081
      CORE_TIMEOUT_SECONDS: ${CORE_TIMEOUT_SECONDS:-2}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      DEMO_CORE_OUTCOME: ${DEMO_CORE_OUTCOME:-CONFIRM}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-policies}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-only-change-me}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  core-mock:
    image: policies-service:0.1.0
    command: ["--process-role=core-mock"]
    init: true
    environment:
      API_KEY: ${API_KEY:-123456}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  worker:
    image: policies-service:0.1.0
    command: ["--process-role=worker"]
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-policies}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-only-change-me}
      CORE_BASE_URL: http://core-mock:8081
      CORE_TIMEOUT_SECONDS: ${CORE_TIMEOUT_SECONDS:-2}
      API_KEY: ${API_KEY:-123456}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      DEMO_CORE_OUTCOME: ${DEMO_CORE_OUTCOME:-CONFIRM}
      MAX_CORE_CONCURRENCY: ${MAX_CORE_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      core-mock:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  scheduler:
    image: policies-service:0.1.0
    command: ["--process-role=scheduler"]
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      RENEWAL_DAYS_AHEAD: ${RENEWAL_DAYS_AHEAD:-30}
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-3600000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  outbox-relay:
    image: policies-service:0.1.0
    command: ["--process-role=outbox-relay"]
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-policies}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-only-change-me}
      OUTBOX_RELAY_POLL_INTERVAL_MS: ${OUTBOX_RELAY_POLL_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-20}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  seed:
    image: policies-service:0.1.0
    command: ["--process-role=seed"]
    profiles: ["demo"]
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    image: nginx:1.27.4-alpine
    depends_on:
      api:
        condition: service_healthy
        restart: true
      core-mock:
        condition: service_healthy
        restart: true
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
