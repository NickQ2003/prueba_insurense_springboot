services:
  db:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policies}
      POSTGRES_USER: ${POSTGRES_USER:-policies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-policies} -d ${POSTGRES_DB:-policies}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: flyway/flyway:11.10.0-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      FLYWAY_USER: ${POSTGRES_USER:-policies}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      FLYWAY_CONNECT_RETRIES: 20
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: policies-service:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-policies}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-policies}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      SPRING_FLYWAY_ENABLED: "false"
      API_KEY: ${API_KEY:-123456}
      API_READ_TOKEN: ${API_READ_TOKEN:-demo-read-token}
      API_OPERATOR_TOKEN: ${API_OPERATOR_TOKEN:-demo-operator-token}
      API_REVIEWER_TOKEN: ${API_REVIEWER_TOKEN:-demo-reviewer-token}
      CORE_BASE_URL: http://core-mock:8081
      CORE_TIMEOUT_SECONDS: ${CORE_TIMEOUT_SECONDS:-2}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      DEMO_CORE_OUTCOME: ${DEMO_CORE_OUTCOME:-CONFIRM}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  core-mock:
    image: policies-service:0.1.0
    command: ["--process-role=core-mock"]
    init: true
    environment:
      API_KEY: ${API_KEY:-123456}
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  gateway:
    image: nginx:1.27.4-alpine
    depends_on:
      api:
        condition: service_healthy
        restart: true
      core-mock:
        condition: service_healthy
        restart: true
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
